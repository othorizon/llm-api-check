<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--app-head-->
    <script>
      (function () {
        var s = null;
        try {
          var raw = localStorage.getItem("wlcu:settings");
          s = raw ? JSON.parse(raw).state : null;
        } catch (e) {}
        // Locale, before first paint. Mirrors redirectLocale() in src/i18n/core.ts: a remembered
        // choice wins; otherwise Chinese-language browsers go to /zh (one-way, so crawlers, which
        // render as en-US without storage, never see a redirect).
        try {
          var p = location.pathname;
          var cur = p === "/zh" || p.indexOf("/zh/") === 0 ? "zh" : "en";
          var stored = s && (s.locale === "zh" || s.locale === "en") ? s.locale : null;
          var lang = (navigator.language || "").toLowerCase();
          var browser = lang === "zh" || lang.indexOf("zh-") === 0 ? "zh" : "en";
          var target = stored || (browser === "zh" ? "zh" : null);
          if (target && target !== cur) {
            var rest = cur === "zh" ? (p === "/zh" ? "/" : p.slice(3)) : p;
            var to = target === "zh" ? (rest === "/" ? "/zh" : "/zh" + rest) : rest;
            // Keep the old document invisible while the replacement loads; restore if it never comes.
            document.documentElement.style.visibility = "hidden";
            setTimeout(function () { document.documentElement.style.visibility = ""; }, 4000);
            location.replace(to + location.search + location.hash);
            return;
          }
        } catch (e) {}
        try {
          var t = s && s.theme ? s.theme : "system";
          var d = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
